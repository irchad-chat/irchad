# cargo-about config for THIRD_PARTY_LICENSES.txt (packaging/licenses.sh).
# A dependency under a license not listed here fails the release build.
accepted = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "0BSD", "Unlicense", "BSL-1.0", "MPL-2.0", "Unicode-3.0",
    "OFL-1.1", "Ubuntu-font-1.0", "BlueOak-1.0.0", "CDLA-Permissive-2.0", "GPL-3.0-or-later",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
