name: Release

# GitHub mirror's twin of .gitea/workflows/release.yml (Gitea only reads
# .gitea/workflows, so this never runs there). The `vX.Y.Z` tag arrives via
# the push mirror and this publishes a GitHub Release with the same assets:
# Linux tarball + deb, Windows installer + update zip, signed Android APK.
# The desktop updater reads these releases (D105). Everything else
# (downloads.gentoo.party, apt, AUR, Play,
# the chadd image, the #chad announcement) is left to Gitea's run.
# Secrets needed here too: UPDATE_SIGNING_KEY, ANDROID_KEYSTORE,
# ANDROID_KEYSTORE_PASSWORD.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # deploy/ci.Dockerfile on ghcr.io, since the LAN registry Gitea uses is out
  # of reach. Inline cache: unchanged layers come straight from the last push.
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/irchad-ci:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          # Its .dockerbuild record artifact breaks publish's download-artifact.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: deploy
          file: deploy/ci.Dockerfile
          push: true
          tags: ${{ steps.ref.outputs.ref }}
          cache-from: type=registry,ref=${{ steps.ref.outputs.ref }}
          cache-to: type=inline

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # The update check compares the tag with the version built in.
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: [image, version]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p chad-desktop
      - run: packaging/linux/tarball.sh
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: packaging/sign.sh irchad-linux-x86_64.tar.gz
      - run: packaging/linux/deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            irchad-linux-x86_64.tar.gz
            irchad-linux-x86_64.deb

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # cuda.h, so webrtc-sys builds NVENC in (vendor/README.md).
      - name: CUDA headers
        shell: pwsh
        run: |
          $h = scripts\cuda-headers.ps1 "$env:RUNNER_TEMP\cuda"
          "CUDA_HOME=$h" >> $env:GITHUB_ENV

      - run: cargo build --release --locked -p chad-desktop

      - name: Installer
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # License notices for the installer (packaging/licenses.sh's Windows twin).
          cargo install --locked cargo-about@0.9.3 --features cli
          $lic = "packaging\windows\licenses"
          New-Item -ItemType Directory -Force $lic | Out-Null
          Copy-Item LICENSE $lic
          cargo about generate --locked --fail -m crates/chad-desktop/Cargo.toml --target x86_64-pc-windows-msvc about.hbs -o "$lic\THIRD_PARTY_LICENSES.txt"
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem "target\release\build\scratch-*\out\livekit_webrtc\livekit\*\*\LICENSE.md", "target\release\build\scratch\*\out\livekit_webrtc\livekit\*\*\LICENSE.md" |
            Sort-Object LastWriteTime | Select-Object -Last 1 | Copy-Item -Destination "$lic\LIBWEBRTC_LICENSES.md"
          if (-not (Test-Path "$lic\LIBWEBRTC_LICENSES.md")) { "libwebrtc LICENSE.md not found"; exit 1 }
          # AMD's AMF headers are compiled into webrtc-sys (vendor/README.md).
          Copy-Item vendor\webrtc-sys\src\amf\AMF\LICENSE.txt "$lic\AMF_LICENSE.txt"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          }
          $v = "${{ needs.version.outputs.version }}"
          makensis /DVERSION=$v "/DEXE=$PWD\target\release\irchad.exe" packaging\windows\irchad.nsi
          if ($LASTEXITCODE) { exit 1 }
          # The signed zip the in-app updater installs from (D76).
          packaging\windows\update-zip.ps1 "target\release\irchad.exe" $v
          if ($LASTEXITCODE) { exit 1 }
          Move-Item packaging\windows\irchad-setup.exe irchad-windows-x86_64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            irchad-windows-x86_64.zip
            irchad-windows-x86_64-setup.exe

  # Asset names stay the same across releases so Obtainium can track them (D40).
  android:
    needs: [image, version]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ANDROID_KEYSTORE: the release keystore, base64. Its store and key
      # share ANDROID_KEYSTORE_PASSWORD; the key alias is `irchad`.
      - name: Build signed APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          IRCHAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ABIS: arm64-v8a
          PROFILE: release
        working-directory: android
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$IRCHAD_KEYSTORE_PASSWORD" ] || { echo "ANDROID_KEYSTORE secrets missing"; exit 1; }
          export IRCHAD_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE" | base64 -d > "$IRCHAD_KEYSTORE"
          ./gradlew --no-daemon assembleFullRelease
          rm "$IRCHAD_KEYSTORE"
          mv app/build/outputs/apk/full/release/app-full-release.apk ../irchad-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: irchad-android-arm64.apk

  # Best effort (macOS is unsupported): a failure here doesn't block publish.
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release --locked -p chad-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p chad-desktop --target x86_64-apple-darwin
      - run: packaging/macos/dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: irchad-macos-universal.dmg

  # Created only once every asset is built, so a failed build leaves no release.
  publish:
    needs: [version, linux, windows, android, macos]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for the release notes
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Notes: the tag message's body (release.sh writes it); for a tag without
          # one, one bullet per commit since the previous tag.
          git fetch -fq origin "refs/tags/$tag:refs/tags/$tag"  # keep it annotated
          notes=$(git tag -l --format='%(contents:body)' "$tag")
          if [ -z "${notes//[[:space:]]/}" ]; then
            prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null) && range="$prev..$tag" || range="$tag"
            notes=$(git log --no-merges --invert-grep --grep='^release ' --format='- %s' "$range")
          fi
          gh release create "$tag" --verify-tag --title "IrChad ${{ needs.version.outputs.version }}" \
            --notes "$notes" assets/*
