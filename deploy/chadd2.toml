# chadd config for the second dev network (ergo2). CHADD_ORIGIN overrides `origin` (compose sets it).
listen = "0.0.0.0:8080"
origin = "https://chat2.localhost:8443"
name = "Chad Dev Network 2"
registration = "open"
# Every chad is put here; its chanops list the official channels in its
# `chad/channels` metadata (deploy/seed.py sets it).
home = "#general"

# DEV ONLY: public secrets, matching ergo.yaml and livekit.yaml.
[ergo]
api = "http://ergo2:8089"
token = "chad-dev-api-token"

# Meetings guests join from a link, no account (D86). Leave out to turn off.
# The secret signs the links; changing it ends every link handed out.
[meetings]
secret = "chad-dev-meeting-secret-0123456789abcdef"
ttl_hours = 24

[livekit]
key = "devkey"
secret = "chad-dev-livekit-secret-0123456789abcdef"

# Account deletion (D69): chadd opers up as `chadd` (ergo.yaml), unregisters the
# account, redacts its messages and deletes its uploads. Leave it out to turn it off.
[delete]
irc = "ergo2:6667"
oper = "chadd"
oper_password = "chaddoper"
export_dir = "/var/lib/chadd/export"
state_dir = "/var/lib/chadd/state"

[uploads]
dir = "/var/lib/chadd/uploads"
max_bytes = 26214400

# Soundboard: every mp3/ogg/wav/flac in here (deploy/sounds, mounted read-only).
[sounds]
dir = "/var/lib/chadd/sounds"

# Custom emoji: every <name>.png/jpg/gif/webp in here is :name: (deploy/emoji,
# mounted read-only). Names are 2 to 32 of a-z, 0-9 and _.
# The images in its stickers/ subdirectory are stickers (D103).
[emoji]
dir = "/var/lib/chadd/emoji"

# Link previews and proxied images. Not under uploads (that dir is public).
[cache]
dir = "/var/lib/chadd/cache"
