# chadd config for the second dev network (ergo2). CHADD_ORIGIN overrides `origin` (compose sets it).
listen = "0.0.0.0:8080"
origin = "https://chat2.localhost:8443"
name = "Chad Dev Network 2"
registration = "open"

# DEV ONLY: public secrets, matching ergo.yaml and livekit.yaml.
[ergo]
api = "http://ergo2:8089"
token = "chad-dev-api-token"

[livekit]
key = "devkey"
secret = "chad-dev-livekit-secret-0123456789abcdef"

[uploads]
dir = "/var/lib/chadd/uploads"
max_bytes = 26214400
