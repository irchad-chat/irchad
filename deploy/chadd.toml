# chadd dev config. CHADD_ORIGIN overrides `origin` (compose sets it).
listen = "0.0.0.0:8080"
origin = "https://chat.localhost:8443"
name = "Chad Dev Network"
# Sidebar icon (HTTPS, ≤1 MiB, PNG/JPEG/WebP); Caddy serves this one.
icon = "https://chat.localhost:8443/icon.png"
registration = "open"
# Every chad is put here; its chanops list the official channels in its
# `chad/channels` metadata (deploy/seed.py sets it).
home = "#general"
# Download Discord's detectable-games list so clients can name the game in a
# Rich Presence update (D63). Undocumented Discord endpoint; off by default.
discord_games = true

# DEV ONLY: public secrets, matching ergo.yaml and livekit.yaml.
[ergo]
api = "http://ergo:8089"
token = "chad-dev-api-token"

[livekit]
key = "devkey"
secret = "chad-dev-livekit-secret-0123456789abcdef"

[uploads]
dir = "/var/lib/chadd/uploads"
max_bytes = 26214400

# Soundboard: every mp3/ogg/wav/flac in here (deploy/sounds, mounted read-only).
[sounds]
dir = "/var/lib/chadd/sounds"

# Link previews and proxied images. Not under uploads (that dir is public).
[cache]
dir = "/var/lib/chadd/cache"

# Invite page colors, #hex only. Unset keys keep the logo's Catppuccin palette.
# Keys: background, surface, text, muted, accent, accent_2, on_accent.
# [colors.light]
# accent = "#40a02b"
# [colors.dark]
# accent = "#a6e3a1"
