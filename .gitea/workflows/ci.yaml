name: CI

on:
  push:
    branches: [main]
    # Docs build nothing, and the job image rebuilds in ci-image.yml (a run
    # here would still pull the old :latest). A push that also touches
    # anything else still runs.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - deploy/ci.Dockerfile
      - .gitea/workflows/ci-image.yml
  pull_request:

# A newer push to the same branch/PR supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No global RUSTFLAGS: it would override the per-target rustflags in
# .cargo/config.toml (Windows needs +crt-static for libwebrtc).
env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Must match a label on a Linux act_runner.
    runs-on: ubuntu-latest
    # PipeWire headers, lavapipe for the wgpu screenshot tests and clang 21
    # for webrtc-sys (CC/CXX/LIBCLANG_PATH set) and Rust, preinstalled.
    # Built by ci-image.yml from deploy/ci.Dockerfile.
    container:
      image: 192.0.2.7:3000/sam/irchad-ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Also caches libwebrtc: webrtc-sys downloads its prebuilt into target/.
      # rust-cache keys on the job id alone, and nightly/release reuse these
      # ids for release builds, so name the key. Don't save on failure: a
      # key is never overwritten until dependencies or rustc change, so a
      # build that died early would pin a partial cache (it did, under
      # v0-rust; bump prefix-key to start over).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: ci-linux

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The Android app: chad-ffi for the emulator ABI, then a debug APK.
  android:
    runs-on: ubuntu-latest
    # JDK, Android SDK and NDK preinstalled (deploy/ci.Dockerfile).
    container:
      image: 192.0.2.7:3000/sam/irchad-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: ci-android
      - run: ./gradlew --no-daemon assembleFullDebug assemblePlayDebug
        working-directory: android

  windows:
    # Must match a label on a Windows act_runner (host mode).
    runs-on: windows-latest
    env:
      # Host mode: each job gets a fresh workspace path, and rust-cache's
      # cache version hashes that path, so it never restored here. A fixed
      # target dir on the runner outlives the job instead, keeping
      # dependencies built. nightly.yml and release.yml use ...\dist.
      CARGO_TARGET_DIR: C:\gitea-runner\cargo-target\ci
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Nothing else cleans it: wipe it past 40 GB.
      - name: Trim target dir
        shell: pwsh
        run: |
          $d = $env:CARGO_TARGET_DIR
          if (Test-Path $d) {
            $gb = (Get-ChildItem $d -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB
            "{0}: {1:N1} GB" -f $d, $gb
            if ($gb -gt 40) { Remove-Item $d -Recurse -Force; "wiped" }
          }

      - run: cargo build --locked
      - run: cargo test --locked

  # Push to main: build chadd against trixie's glibc and swap it on chad-prod
  # (deploy/native/README.md), but only when chadd's inputs changed since the
  # commit prod runs (/usr/local/bin/chadd.rev). Diffing against prod, not
  # the push's `before`, means a deploy whose run was cancelled or failed is
  # picked up by the next push. PROD_SSH_KEY: a private key in root's
  # authorized_keys on the server.
  deploy-chadd:
    needs: linux
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-chadd
    env:
      HOST: root@64.177.55.62
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the diff reaches back to prod's commit.
          fetch-depth: 0
      - name: SSH key
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "64.177.55.62 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJxUsvP6xFUASiojiJKnRe5VBg1J+JT6PrufoK9RoGcm" > ~/.ssh/known_hosts
      - name: Changed since prod?
        id: changed
        run: |
          # chadd's build inputs: itself, its only workspace dependency, the
          # lockfile and workspace manifest, cargo config and its Dockerfile.
          paths="crates/chadd crates/chad-proto Cargo.toml Cargo.lock .cargo deploy/chadd.Dockerfile"
          prod=$(ssh -i ~/.ssh/id "$HOST" 'cat /usr/local/bin/chadd.rev 2>/dev/null' || true)
          if ! git cat-file -e "${prod}^{commit}" 2>/dev/null; then
            echo "prod's commit unknown (${prod:-none}): deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prod" "$GITHUB_SHA" -- $paths; then
            echo "chadd unchanged since prod's ${prod:0:9}: skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat "$prod" "$GITHUB_SHA" -- $paths
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.changed.outputs.deploy == 'true'
        run: |
          docker build -f deploy/chadd.Dockerfile -t irchad-chadd .
          docker cp "$(docker create irchad-chadd)":/usr/local/bin/chadd ./chadd
      - name: Deploy
        if: steps.changed.outputs.deploy == 'true'
        run: |
          # Write beside, then rename: overwriting a running binary fails with
          # ETXTBSY. Record the commit only once the new chadd is up.
          ssh -i ~/.ssh/id "$HOST" "cat > /usr/local/bin/chadd.new && chmod 755 /usr/local/bin/chadd.new \
            && mv /usr/local/bin/chadd.new /usr/local/bin/chadd \
            && systemctl restart chadd && sleep 2 && systemctl is-active chadd \
            && echo $GITHUB_SHA > /usr/local/bin/chadd.rev" < chadd
