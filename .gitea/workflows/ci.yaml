name: CI

on:
  push:
    branches: [main]
    # The job image rebuilds in ci-image.yml; a run here would still pull
    # the old :latest. Pushes that touch anything else still run.
    paths-ignore:
      - deploy/ci.Dockerfile
      - .gitea/workflows/ci-image.yml
  pull_request:

# A newer push to the same branch/PR supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No global RUSTFLAGS: it would override the per-target rustflags in
# .cargo/config.toml (Windows needs +crt-static for libwebrtc).
env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Must match a label on a Linux act_runner.
    runs-on: ubuntu-latest
    env:
      # webrtc-sys needs clang >= 21 (libwebrtc ships a hermetic libc++).
      CC: clang-21
      CXX: clang++-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      # PipeWire headers for pipewire-sys; lavapipe (software Vulkan) so the
      # wgpu screenshot tests find an adapter; clang 21 from apt.llvm.org for
      # webrtc-sys and bindgen.
      - name: Install system packages
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libfontconfig-dev pkg-config \
            mesa-vulkan-drivers libvulkan1 wget gnupg lsb-release software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          $SUDO bash /tmp/llvm.sh 21
          $SUDO apt-get install -y --no-install-recommends libclang-21-dev
          clang++-21 --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Also caches libwebrtc: webrtc-sys downloads its prebuilt into target/.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows:
    # Must match a label on a Windows act_runner (host mode).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked
      - run: cargo test --locked

  # Push to main: build chadd against trixie's glibc and swap it on chad-prod
  # (deploy/native/README.md). PROD_SSH_KEY: a private key in root's
  # authorized_keys on the server.
  deploy-chadd:
    needs: linux
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-chadd
    env:
      HOST: root@64.177.55.62
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -f deploy/chadd.Dockerfile -t irchad-chadd .
          docker cp "$(docker create irchad-chadd)":/usr/local/bin/chadd ./chadd
      - name: Deploy
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "64.177.55.62 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJxUsvP6xFUASiojiJKnRe5VBg1J+JT6PrufoK9RoGcm" > ~/.ssh/known_hosts
          # Write beside, then rename: overwriting a running binary fails with ETXTBSY.
          ssh -i ~/.ssh/id "$HOST" 'cat > /usr/local/bin/chadd.new && chmod 755 /usr/local/bin/chadd.new \
            && mv /usr/local/bin/chadd.new /usr/local/bin/chadd \
            && systemctl restart chadd && sleep 2 && systemctl is-active chadd' < chadd
