name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    # Must match a label on a Linux act_runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PipeWire headers and libclang for pipewire-sys bindgen.
      - name: Install system packages
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev clang pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Also caches libwebrtc: webrtc-sys downloads its prebuilt into target/.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  windows:
    # Must match a label on a Windows act_runner (host mode).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked
      - run: cargo test --locked
