name: Release

# Push a tag `vX.Y.Z` (matching the workspace version) to publish a release:
# the Linux tarball, the Windows installer, the signed Android APK
# (arm64), and the chadd container image at git.gentoo.party/sam/chadd:<version>.
# Before tagging, run docs/release.md's checklist (fuzzing stays out of CI).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          AUTH: "Authorization: token ${{ github.token }}"
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # The update check compares the tag with the version built in.
          [ "$tag" = "v$version" ] || { echo "tag $tag != v$version in Cargo.toml"; exit 1; }
          id=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/releases" \
            -d "{\"tag_name\":\"$tag\",\"name\":\"IrChad $version\",\"draft\":true}" | jq -r .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: release
    runs-on: ubuntu-latest
    # Same job container as ci.yaml (deploy/ci.Dockerfile).
    container:
      image: 192.0.2.7:3000/sam/irchad-ci:latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      # nightly.yml's cache: it keeps it fresh, so tags only restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          save-if: false

      - run: cargo build --release --locked -p chad-desktop

      - name: Tarball
        run: packaging/linux/tarball.sh

      - name: Upload asset
        run: |
          curl -fsS -X POST -H "Authorization: token ${{ github.token }}" -F "attachment=@irchad-linux-x86_64.tar.gz" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets?name=irchad-linux-x86_64.tar.gz"

  # Disabled for now; flip `if` to bring the Flatpak bundle back (and add it
  # to `publish`'s needs).
  flatpak:
    if: false
    needs: release
    runs-on: ubuntu-latest
    # flatpak-builder needs bubblewrap's namespaces: the act_runner must allow
    # privileged job containers (`container.privileged: true` in its config).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo \
            build packaging/flatpak/party.gentoo.IrChad.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo irchad.flatpak party.gentoo.IrChad
      - name: Upload asset
        run: |
          curl -fsS -X POST -H "Authorization: token ${{ github.token }}" -F "attachment=@irchad.flatpak" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets?name=irchad-${{ needs.release.outputs.version }}-x86_64.flatpak"

  windows:
    needs: release
    runs-on: windows-latest
    env:
      # Fixed target dir on the host-mode runner, shared with nightly.yml
      # (see ci.yaml's windows job for why not rust-cache).
      CARGO_TARGET_DIR: C:\gitea-runner\cargo-target\dist
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Trim target dir
        shell: pwsh
        run: |
          $d = $env:CARGO_TARGET_DIR
          if (Test-Path $d) {
            $gb = (Get-ChildItem $d -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB
            "{0}: {1:N1} GB" -f $d, $gb
            if ($gb -gt 40) { Remove-Item $d -Recurse -Force; "wiped" }
          }

      - run: cargo build --release --locked -p chad-desktop

      - name: Installer and upload
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          }
          $v = "${{ needs.release.outputs.version }}"
          makensis /DVERSION=$v "/DEXE=${env:CARGO_TARGET_DIR}\release\irchad.exe" packaging\windows\irchad.nsi
          $url = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets"
          curl.exe -fsS -X POST -H "Authorization: token ${{ github.token }}" `
            -F "attachment=@packaging/windows/irchad-setup.exe" "${url}?name=irchad-windows-x86_64-setup.exe"

  # Asset names stay the same across releases so Obtainium can track them (D40).
  android:
    # One fat-LTO link at a time: two in parallel OOM the runner (0.1.2).
    needs: [release, linux]
    runs-on: ubuntu-latest
    container:
      image: 192.0.2.7:3000/sam/irchad-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ANDROID_KEYSTORE: the release keystore, base64. Its store and key
      # share ANDROID_KEYSTORE_PASSWORD; the key alias is `irchad`.
      - name: Build signed APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          IRCHAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ABIS: arm64-v8a
          PROFILE: release
        working-directory: android
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$IRCHAD_KEYSTORE_PASSWORD" ] || { echo "ANDROID_KEYSTORE secrets missing"; exit 1; }
          export IRCHAD_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE" | base64 -d > "$IRCHAD_KEYSTORE"
          ./gradlew --no-daemon assembleFullRelease
          rm "$IRCHAD_KEYSTORE"

      - name: Upload asset
        run: |
          curl -fsS -X POST -H "Authorization: token ${{ github.token }}" \
            -F "attachment=@android/app/build/outputs/apk/full/release/app-full-release.apk" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets?name=irchad-android-arm64.apk"

  chadd-image:
    needs: [release, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # REGISTRY_TOKEN: a Gitea token with package write access (the job token
      # can't push packages).
      - name: Build and push
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          registry=git.gentoo.party
          image=$registry/sam/chadd
          echo "$TOKEN" | docker login "$registry" -u sam --password-stdin
          docker build -f deploy/chadd.Dockerfile -t "$image:${{ needs.release.outputs.version }}" -t "$image:latest" .
          docker push "$image:${{ needs.release.outputs.version }}"
          docker push "$image:latest"

  publish:
    needs: [release, linux, windows, android, chadd-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # S3_ACCESS_KEY/S3_SECRET_KEY: garage's `gitea-actions` key (woodford).
      # Mirrored while still a draft, so a failure here leaves it unpublished.
      - name: Mirror to downloads.gentoo.party
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ github.token }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: deploy/s3-mirror.sh ${{ needs.release.outputs.id }} irchad/v${{ needs.release.outputs.version }} irchad/latest
      - name: Publish the draft
        run: |
          curl -fsS -X PATCH -H "Authorization: token ${{ github.token }}" -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}" \
            -d '{"draft":false}'
      # CHADSTER_PASSWORD: SASL password of the `chadster` account on irchad.chat.
      # Best effort: a failed announcement doesn't fail a published release.
      - name: Announce in #chad
        continue-on-error: true
        env:
          CHADSTER_PASSWORD: ${{ secrets.CHADSTER_PASSWORD }}
        run: python3 deploy/tools/announce.py ${{ needs.release.outputs.version }} "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.release.outputs.version }}"
