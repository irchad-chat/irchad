name: Nightly

# Rolling "nightly" prerelease: once a night it's replaced with a release
# build of main's HEAD, unless main hasn't moved since. Run it by hand for a
# fresh one sooner. Asset URLs stay stable (linked from README.md and
# chadd's landing page).
on:
  schedule:
    # 04:00 UTC, midnight US Eastern.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          AUTH: "Authorization: token ${{ github.token }}"
        run: |
          # A scheduled run with nothing new keeps the current nightly; the
          # build jobs skip when `id` is empty. By hand, always rebuild.
          current=$(curl -sS -H "$AUTH" "$API/tags/nightly" | jq -r '.commit.sha // empty')
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$current" = "$GITHUB_SHA" ]; then
            echo "nightly is already main@${GITHUB_SHA:0:9}"
            exit 0
          fi
          # Old release/tag may not exist yet; 404 is fine.
          curl -sS -o /dev/null -X DELETE -H "$AUTH" "$API/releases/tags/nightly"
          curl -sS -o /dev/null -X DELETE -H "$AUTH" "$API/tags/nightly"
          id=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/releases" \
            -d "{\"tag_name\":\"nightly\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"Nightly\",\"prerelease\":true,\"body\":\"Release build of main@${GITHUB_SHA:0:9}. Rebuilt nightly when main has changed.\"}" \
            | jq -r .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  linux:
    needs: release
    if: needs.release.outputs.id != ''
    runs-on: ubuntu-latest
    # Same job container as ci.yaml (deploy/ci.Dockerfile).
    container:
      image: 192.0.2.7:3000/sam/irchad-ci:latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      # Shared with release.yml, so a tag build starts from nightly's target/.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux

      - run: cargo build --release --locked -p chad-desktop
        env:
          # Read by the update check (crates/chad-desktop/src/update.rs).
          IRCHAD_NIGHTLY: ${{ github.sha }}

      - name: Tarball
        run: packaging/linux/tarball.sh
        env:
          # Written to the tarball's VERSION (packaging/linux/tarball.sh).
          IRCHAD_NIGHTLY: ${{ github.sha }}

      # UPDATE_SIGNING_KEY: the updater's zipsign private key, base64 (D76).
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: packaging/sign.sh irchad-linux-x86_64.tar.gz

      - name: Upload asset
        run: |
          curl -fsS -X POST -H "Authorization: token ${{ github.token }}" \
            -F "attachment=@irchad-linux-x86_64.tar.gz" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets?name=irchad-linux-x86_64.tar.gz"

  windows:
    needs: release
    if: needs.release.outputs.id != ''
    runs-on: windows-latest
    env:
      # Fixed target dir on the host-mode runner, shared with release.yml
      # (see ci.yaml's windows job for why not rust-cache).
      CARGO_TARGET_DIR: C:\gitea-runner\cargo-target\dist
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Trim target dir
        shell: pwsh
        run: |
          $d = $env:CARGO_TARGET_DIR
          if (Test-Path $d) {
            $gb = (Get-ChildItem $d -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB
            "{0}: {1:N1} GB" -f $d, $gb
            if ($gb -gt 40) { Remove-Item $d -Recurse -Force; "wiped" }
          }

      # cuda.h, so webrtc-sys builds NVENC in (vendor/README.md). Fetched
      # once into a fixed dir on the runner, hash-checked.
      - name: CUDA headers
        shell: pwsh
        run: |
          $h = scripts\cuda-headers.ps1 C:\gitea-runner\cuda
          "CUDA_HOME=$h" >> $env:GITHUB_ENV

      - run: cargo build --release --locked -p chad-desktop
        env:
          # Read by the update check (crates/chad-desktop/src/update.rs).
          IRCHAD_NIGHTLY: ${{ github.sha }}

      # NSIS on the runner: `choco install nsis` once, or this installs it.
      - name: Installer
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # License notices for the installer (packaging/licenses.sh's Windows twin).
          cargo about --version 2>$null; if ($LASTEXITCODE) { cargo install --locked cargo-about@0.9.3 --features cli }
          $lic = "packaging\windows\licenses"
          New-Item -ItemType Directory -Force $lic | Out-Null
          Copy-Item LICENSE $lic
          cargo about generate --locked --fail -m crates/chad-desktop/Cargo.toml --target x86_64-pc-windows-msvc about.hbs -o "$lic\THIRD_PARTY_LICENSES.txt"
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem "${env:CARGO_TARGET_DIR}\release\build\scratch-*\out\livekit_webrtc\livekit\*\*\LICENSE.md" |
            Sort-Object LastWriteTime | Select-Object -Last 1 | Copy-Item -Destination "$lic\LIBWEBRTC_LICENSES.md"
          if (-not (Test-Path "$lic\LIBWEBRTC_LICENSES.md")) { "libwebrtc LICENSE.md not found"; exit 1 }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          }
          makensis /DVERSION=nightly "/DEXE=${env:CARGO_TARGET_DIR}\release\irchad.exe" packaging\windows\irchad.nsi
          # The signed zip the in-app updater installs from (D76).
          packaging\windows\update-zip.ps1 "${env:CARGO_TARGET_DIR}\release\irchad.exe" "nightly ${{ github.sha }}"
          if ($LASTEXITCODE) { exit 1 }
          $url = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets"
          curl.exe -fsS -X POST -H "Authorization: token ${{ github.token }}" `
            -F "attachment=@irchad-windows-x86_64.zip" "${url}?name=irchad-windows-x86_64.zip"
          if ($LASTEXITCODE) { exit 1 }
          # Last: update.rs takes the installer as "this nightly is ready".
          curl.exe -fsS -X POST -H "Authorization: token ${{ github.token }}" `
            -F "attachment=@packaging/windows/irchad-setup.exe" "${url}?name=irchad-windows-x86_64-setup.exe"

  # S3_ACCESS_KEY/S3_SECRET_KEY: a garage key with write access to the bucket.
  mirror:
    needs: [release, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror to downloads.gentoo.party
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ github.token }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: deploy/s3-mirror.sh ${{ needs.release.outputs.id }} irchad/nightly
