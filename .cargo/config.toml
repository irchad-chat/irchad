# libwebrtc's prebuilt Windows libs use the static CRT (/MT).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# getrandom 0.3 needs this cfg (and its `wasm_js` feature, enabled by chad-web) for the browser.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
