version: '3'

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  build:
    desc: Build the irchad client (release) for the host OS
    # cargo targets the host triple by default, so this yields a Windows
    # build on Windows and a Linux build on Linux.
    cmds:
      - cargo build --release --locked -p chad-desktop
      - cmd: echo "built target/release/irchad{{.EXE}}"
        silent: true
