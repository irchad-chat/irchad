version: '3'

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  build:
    desc: Build the irchad client (release) for the host OS
    # cargo targets the host triple by default, so this yields a Windows
    # build on Windows and a Linux build on Linux.
    cmds:
      - cmd: cargo build --release --locked -p chad-desktop
        platforms: [linux, darwin]
      # CUDA_HOME makes webrtc-sys compile NVENC in (D89). The script fetches
      # cuda.h into target/cuda on first use and prints the directory. Done in
      # one PowerShell so the path never passes through sh (CRLF, backslashes).
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -Command '$env:CUDA_HOME = & scripts\cuda-headers.ps1; cargo build --release --locked -p chad-desktop; exit $LASTEXITCODE'
        platforms: [windows]
      - cmd: echo "built target/release/irchad{{.EXE}}"
        silent: true

  play:
    desc: Build the signed Play Store bundle (arm64) for upload to the Play Console
    dir: android
    preconditions:
      # Without these the bundle gets the debug key, which Play rejects.
      - sh: test -f "$IRCHAD_PLAY_KEYSTORE" && test -n "$IRCHAD_PLAY_KEYSTORE_PASSWORD"
        msg: set IRCHAD_PLAY_KEYSTORE (the Play upload .p12, key alias irchad) and IRCHAD_PLAY_KEYSTORE_PASSWORD
    cmds:
      # The Play upload key, not the APK's release key (the Play app is chat.irchad.IrChad).
      # Set inline: the shell's variables would override task env.
      # Gradle 8.14 can't run on JDK 25 (the system default).
      - JAVA_HOME=/usr/lib/jvm/openjdk-bin-21 ABIS=arm64-v8a PROFILE=release IRCHAD_KEYSTORE="$IRCHAD_PLAY_KEYSTORE" IRCHAD_KEYSTORE_PASSWORD="$IRCHAD_PLAY_KEYSTORE_PASSWORD" ./gradlew --no-daemon bundlePlayRelease
      - cmd: echo "built android/app/build/outputs/bundle/playRelease/app-play-release.aab"
        silent: true

  apk:
    desc: Build the signed sideload APK (arm64, full flavor)
    dir: android
    preconditions:
      # Without these the APK gets the debug key and won't install over a release build.
      - sh: test -f "$IRCHAD_KEYSTORE" && test -n "$IRCHAD_KEYSTORE_PASSWORD"
        msg: set IRCHAD_KEYSTORE (the APK release .p12, key alias irchad) and IRCHAD_KEYSTORE_PASSWORD
    cmds:
      # ABIS and PROFILE reach build-rust.sh: its defaults are the x86_64 emulator and a debug build.
      - JAVA_HOME=/usr/lib/jvm/openjdk-bin-21 ABIS=arm64-v8a PROFILE=release ./gradlew assembleFullRelease
      - cmd: echo "built android/app/build/outputs/apk/full/release/app-full-release.apk"
        silent: true

  apk:install:
    desc: Install the built APK over adb, keeping app data (DEVICE=ip:port picks a device)
    cmds:
      - adb {{if .DEVICE}}-s {{.DEVICE}}{{end}} install -r android/app/build/outputs/apk/full/release/app-full-release.apk
