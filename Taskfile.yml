version: '3'

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  build:
    desc: Build the irchad client (release) for the host OS
    # cargo targets the host triple by default, so this yields a Windows
    # build on Windows and a Linux build on Linux.
    cmds:
      - cargo build --release --locked -p chad-desktop
      - cmd: echo "built target/release/irchad{{.EXE}}"
        silent: true

  play:
    desc: Build the signed Play Store bundle (arm64) for upload to the Play Console
    dir: android
    preconditions:
      # Without these the bundle gets the debug key, which Play rejects.
      - sh: test -f "$IRCHAD_PLAY_KEYSTORE" && test -n "$IRCHAD_PLAY_KEYSTORE_PASSWORD"
        msg: set IRCHAD_PLAY_KEYSTORE (the Play upload .p12, key alias irchad) and IRCHAD_PLAY_KEYSTORE_PASSWORD
    cmds:
      # The Play upload key, not the APK's release key (the Play app is chat.irchad.IrChad).
      # Set inline: the shell's variables would override task env.
      - ABIS=arm64-v8a PROFILE=release IRCHAD_KEYSTORE="$IRCHAD_PLAY_KEYSTORE" IRCHAD_KEYSTORE_PASSWORD="$IRCHAD_PLAY_KEYSTORE_PASSWORD" ./gradlew --no-daemon bundlePlayRelease
      - cmd: echo "built android/app/build/outputs/bundle/playRelease/app-play-release.aab"
        silent: true
