[package]
name = "chad-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "irchad"
path = "src/main.rs"

[dependencies]
chad-core.workspace = true
chad-media.workspace = true
eframe = { workspace = true, features = ["persistence", "system_fonts"] }
egui.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = "0.2.38"
notify-rust = "4.18.2"
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
ksni = "0.3.7"
x11rb = { version = "0.13.2", features = ["xinput"] }
zbus = "5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
tempfile = "3.27.0"
