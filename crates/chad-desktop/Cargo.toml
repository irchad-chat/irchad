[package]
name = "chad-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "irchad"
path = "src/main.rs"

[dependencies]
chad-core.workspace = true
chad-media.workspace = true
eframe = { workspace = true, features = ["persistence", "system_fonts"] }
egui.workspace = true
emojis = "0.9.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jiff = "0.2.38"
notify-rust = "4.18.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[features]
# Linux display servers; build with --no-default-features --features x11 (or wayland) to drop one.
default = ["wayland", "x11"]
wayland = ["eframe/wayland", "dep:wayland-client", "dep:wayland-protocols"]
x11 = ["eframe/x11", "dep:x11rb"]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
ksni = "0.3.7"
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
x11rb = { version = "0.13.2", features = ["xinput", "screensaver"], optional = true }
zbus = "5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
egui_system_font_provider = "0.37.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
