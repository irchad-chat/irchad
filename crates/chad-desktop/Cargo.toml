[package]
name = "chad-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "irchad"
path = "src/main.rs"

[dependencies]
chad-core.workspace = true
chad-media.workspace = true
eframe = { workspace = true, features = ["persistence", "system_fonts"] }
egui.workspace = true
emojis = "0.9.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jiff = "0.2.38"
notify-rust = "4.18.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Updates (D76): signature check, unpacking and the swap. Downloads go
# through reqwest above; `ureq` is only there because it won't build without
# an HTTP client.
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "signatures", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
self-replace = "1.5"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[features]
# Linux display servers; build with --no-default-features --features x11 (or wayland) to drop one.
default = ["wayland", "x11"]
wayland = ["eframe/wayland", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:wayland-backend"]
x11 = ["eframe/x11", "dep:x11rb"]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
ksni = "0.3.7"
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
# The overlay's layer surface (D75); `client_system` for the libwayland pointers wgpu needs.
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }
wayland-backend = { version = "0.3.17", features = ["client_system"], optional = true }
x11rb = { version = "0.13.2", features = ["xinput", "screensaver"], optional = true }
zbus = "5"
# The Wayland overlay's own egui context gets the system fallback fonts eframe gives its own (D75).
egui_system_font_provider = "0.37.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["ApplicationModel", "Foundation_Collections", "Media_Control", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
# Signed test archives for update.rs.
flate2 = "1.1"
tar = "0.4"
zipsign-api = { version = "0.2.2", default-features = false, features = ["sign-tar"] }
egui_system_font_provider = "0.37.0"
livekit.workspace = true
livekit-api.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
