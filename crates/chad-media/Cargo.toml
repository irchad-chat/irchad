[package]
name = "chad-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = "0.3"
livekit.workspace = true
nnnoiseless = { version = "0.5.2", default-features = false }
rtrb = "0.4.1"
serde.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac"] }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { workspace = true, features = ["v0_3_49"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "camera"] }
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"

[dev-dependencies]
livekit-api.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
