[package]
name = "chad-irc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chad-irc = { path = ".." }

# Not part of the main workspace. Run: RUSTC_BOOTSTRAP=1 cargo fuzz run message -s none
[workspace]

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false
