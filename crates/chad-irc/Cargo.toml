[package]
name = "chad-irc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
getrandom = "0.3.4"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
tracing.workspace = true

[features]
default = ["ws"]
# The tokio/rustls WebSocket transport; off for wasm, where the browser's WebSocket is the transport.
ws = ["dep:futures-util", "dep:rustls", "dep:rustls-native-certs", "dep:tokio", "dep:tokio-rustls", "dep:tokio-tungstenite"]

[lints]
workspace = true

[dev-dependencies]
tokio.workspace = true
proptest = "1.12.0"

[target.'cfg(target_os = "ios")'.dependencies]
rustls-platform-verifier = "0.7.1"

[[test]]
name = "ergo_live"
required-features = ["ws"]
